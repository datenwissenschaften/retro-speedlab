paths:
  roms: roms
  integrations: integrations
  models: working/models
  cache: working/cache
  lab_run: ../.lab-run
training:
  game: {{ cookiecutter.game }}
log_level: INFO
upload:
  url: https://api.retrospeedlab.com
  api_key: null
ui:
  enable: true
  release: local
twitch:
  enabled: {{ cookiecutter.twitch_enabled }}
dokku:
  host: {{ cookiecutter.dokku_host }}
  server: {{ cookiecutter.dokku_server }}
  app: {{ cookiecutter.project_slug }}
  data_dir: /var/lib/dokku/data/storage/{{ cookiecutter.project_slug }}
  workspace_dir: {{ cookiecutter.dokku_workspace_dir }}
  host_address: {{ cookiecutter.dokku_host_address }}
speedrun:
  workers: 10
  segment_seconds: 120
  id: {{ cookiecutter.project_slug }}
  title: "{{ cookiecutter.game_title }}"
  platform: NES
  category: Any%
  speedrun_com:
    game: <speedrun.com game id>
    category: <speedrun.com category id>
    variables: {}
  tasvideos: <TASVideos game id>
agent:
  schedule: "*/10 * * * *"
  stall_minutes: 15
  minutes: 12
  extension_minutes: 6
  model: opus
  git_name: {{ cookiecutter.project_name }} lab agent
  git_email: {{ cookiecutter.author_email }}
