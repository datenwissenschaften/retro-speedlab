paths:
  roms: roms
  integrations: integrations
  models: working/models
  recordings: working/recordings
  cache: working/cache
  database: working/database.json
  reports: agent/reports
  curriculum: curriculum
  demonstrations: agent/demonstrations
  lab_run: ../.lab-run

training:
  game: {{ cookiecutter.game }}
  fingerprint: null

laya:
  checkpoint: convaiinnovations/laya

log_level: INFO

upload:
  url: https://api.retrospeedlab.com
  api_key: null

ui:
  enable: true
  max_episodes: 1000
  release: local
  persona: Laya

twitch:
  enabled: false
  summary_models:
    - google/gemma-4-31b-it:free

dokku:
  host: dokku
  server: dokku-host
  app: {{ cookiecutter.project_slug }}
  data_dir: /var/lib/{{ cookiecutter.project_slug }}
  workspace_dir: /srv/{{ cookiecutter.project_slug }}-workspace
  host_address: 172.17.0.1

agent:
  schedule: "30 3,9,15,21 * * *"
  hours: 4
  model: sonnet
  git_name: {{ cookiecutter.project_name }} daily agent
  git_email: {{ cookiecutter.author_email }}
