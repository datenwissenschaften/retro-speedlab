paths:
  roms: roms
  models: working/models
  recordings: working/recordings
  cache: working/cache
  database: working/database.json

training:
  game: Airstriker-Genesis-v0
  savestate: Level1
  fingerprint: null

laya:
  checkpoint: convaiinnovations/laya

log_level: INFO

upload:
  url: https://speedlab.datenwissenschaften.com/api
  api_key: null

ui:
  enable: true
  host: 127.0.0.1
  port: 18080
  max_episodes: 1000
  release: local

twitch:
  enabled: false
  dialogs: false
  dialog_model: google/gemma-4-31b-it:free

dokku:
  host: dokku
  server: dokku-host
  app: {{ cookiecutter.project_slug }}
  data_dir: /var/lib/{{ cookiecutter.project_slug }}
  workspace_dir: /srv/{{ cookiecutter.project_slug }}-workspace
  host_address: 172.17.0.1

agent:
  schedule: "30 3 * * *"
  hours: 4
  git_name: {{ cookiecutter.project_name }} daily agent
  git_email: {{ cookiecutter.author_email }}
